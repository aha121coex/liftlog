<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="application-version" content="4.2.0">
  <meta name="theme-color" content="#0d141a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <meta name="description" content="Private one-tap workout logging and offline strength training coach.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>LiftLog • Quick workout coach</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="LiftLog home"><span class="brand-mark" aria-hidden="true">L<span class="brand-dot"></span></span><span>LiftLog</span></div>
      <div class="topbar-right"><span class="private-tag"><span class="private-dot"></span> On-device</span></div>
    </header>

    <main id="view" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-tab="today" class="nav-item active" aria-label="Today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5M5.5 10.5V21h13V10.5M9.5 21v-7h5v7"/></svg><span>Today</span>
      </button>
      <button type="button" data-tab="workout" class="nav-item" aria-label="Workout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12M9 7v10M15 7v10"/></svg><span>Workout</span>
      </button>
      <button type="button" data-tab="history" class="nav-item" aria-label="History">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7.5 15h3M7.5 18h6"/></svg><span>History</span>
      </button>
      <button type="button" data-tab="progress" class="nav-item" aria-label="Progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h17M8 16l4-5 3 2 5-7"/></svg><span>Progress</span>
      </button>
      <button type="button" data-tab="more" class="nav-item" aria-label="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span>More</span>
      </button>
    </nav>
  </div>
  <div id="sheet-root" class="sheet-root" aria-live="off"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
