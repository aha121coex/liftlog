name: Tests
on: [push, pull_request, workflow_call]
permissions:
  contents: read
  issues: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python scripts/build-site.py
      - run: python scripts/browser-smoke.py --engine ${{ matrix.engine }}
      - run: python drawdown/scripts/browser-smoke.py --engine ${{ matrix.engine }}
      - if: matrix.engine == 'chromium'
        run: python scripts/upgrade-smoke.py
  live-market-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every watchlist symbol before release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node drawdown/scripts/update-data.mjs --output "$RUNNER_TEMP/drawdown-monitor.json"
          node --input-type=module -e 'import fs from "node:fs"; const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/drawdown-monitor.json")); if (data.results.slice(0,16).length !== 16 || data.results.slice(0,16).some(row => !row.windows?.["5y"] || row.cached)) throw new Error("All 16 default symbols must update before the first release.");'
